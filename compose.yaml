services:
  api_server:
    build: .
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=crud_example'
      - 'POSTGRES_USER=crud_user'
      - 'POSTGRES_PASSWORD=crud_password'
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crud_user -d crud_example"]
      interval: 1s
      timeout: 1s
